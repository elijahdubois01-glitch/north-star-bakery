<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>North Star Bakery | Contact</title>
</head>

<body>

    <header>
        <h1>Contact North Star Bakery</h1>

        <nav aria-label="Primary navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Preorders and Contact Requests</h2>

            <p>
                Complete the form below to contact North Star Bakery
                or submit a preorder request.
            </p>

            <form action="#" method="post">

                <fieldset>
                    <legend>Customer Information</legend>

                    <label for="name">Name:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required>

                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required>

                    <label for="pickup-date">Pickup Date:</label>
                    <input
                        type="date"
                        id="pickup-date"
                        name="pickup-date"
                        required>
                </fieldset>

                <fieldset>
                    <legend>Request Details</legend>

                    <label for="request-type">Request Type:</label>
                    <select
                        id="request-type"
                        name="request-type"
                        required>
                        <option value="">Select a request</option>
                        <option value="preorder">Preorder</option>
                        <option value="question">General Question</option>
                    </select>

                    <label for="item-details">Item Details:</label>
                    <textarea
                        id="item-details"
                        name="item-details"
                        rows="4"
                        required></textarea>

                    <label for="allergy-notes">Allergy Notes:</label>
                    <textarea
                        id="allergy-notes"
                        name="allergy-notes"
                        rows="3"></textarea>
                </fieldset>

                <button type="submit">Submit Request</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 North Star Bakery</p>
    </footer>

</body>
</html>
